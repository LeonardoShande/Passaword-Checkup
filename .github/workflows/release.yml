name: Release

# Se ejecuta al subir una etiqueta, por ejemplo:  git tag v1.1.0 && git push --tags
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # crear la release
      id-token: write        # firma de la atestación (Sigstore)
      attestations: write    # publicar la atestación
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Empaquetar (reproducible) y verificar
        run: |
          npm run package
          npm run verify -- dist/*.zip
          (cd dist && sha256sum -c *.sha256)
      - name: Atestación de procedencia (quién y desde qué commit se construyó)
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*.zip
      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip dist/*.sha256 --generate-notes
